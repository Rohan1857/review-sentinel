apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespace.yaml
  - rbac.yaml
  - redis.yaml
  - deployment.yaml
  - service.yaml

configMapGenerator:
  - name: review-sentinel-config
    namespace: review-sentinel
    files:
      - config.yaml
    options:
      disableNameSuffixHash: true
