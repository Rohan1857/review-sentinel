apiVersion: v1
kind: ServiceAccount
metadata:
  name: review-sentinel-server
  namespace: review-sentinel
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: review-sentinel-job-creator
  namespace: review-sentinel
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "list", "watch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: review-sentinel-job-creator
  namespace: review-sentinel
subjects:
  - kind: ServiceAccount
    name: review-sentinel-server
    namespace: review-sentinel
roleRef:
  kind: Role
  name: review-sentinel-job-creator
  apiGroup: rbac.authorization.k8s.io
