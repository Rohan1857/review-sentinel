name: CI

on:
  push:
    branches: [main]
    tags: ["[0-9]+.[0-9]+.[0-9]+"]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - run: uv sync

      - name: Ruff lint
        run: uv run ruff check review_sentinel/ tests/

      - name: Ruff format
        run: uv run ruff format --check review_sentinel/ tests/

      - name: Mypy
        run: uv run mypy review_sentinel/

      - name: Check docstrings
        working-directory: .
        run: python3 scripts/check_docstrings.py --ci

  unit-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - run: uv sync

      - name: Pytest
        run: uv run pytest

  unit-test-provider-isolation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        extras: [anthropic, openai, google]
    name: unit-test (${{ matrix.extras }} only)
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - name: Install with ${{ matrix.extras }} extra only
        run: uv sync --no-default-groups --group test --extra ${{ matrix.extras }}

      - name: Pytest
        run: uv run --no-sync pytest

  integration-test-local:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - run: uv sync

      - name: Integration tests (local)
        env:
          TEST_PIPELINE_ID: ${{ github.sha }}
          TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          NOMINALBOT_GITHUB_APP_ID: ${{ secrets.NOMINALBOT_GITHUB_APP_ID }}
          NOMINALBOT_GITHUB_APP_PRIVATE_KEY: ${{ secrets.NOMINALBOT_GITHUB_APP_PRIVATE_KEY }}
          NOMINALBOT_GITHUB_INSTALLATION_ID: ${{ secrets.NOMINALBOT_GITHUB_INSTALLATION_ID }}
          TEST_GITLAB_TOKEN: ${{ secrets.TEST_GITLAB_TOKEN }}
        run: uv run pytest tests/integration/ -m integration -v

  build-image:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - extras: anthropic
            image: review-sentinel-anthropic
          - extras: openai
            image: review-sentinel-openai
          - extras: google
            image: review-sentinel-google
          - extras: all
            image: review-sentinel
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ci/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          build-args: |
            EXTRAS=${{ matrix.extras }}
            SETUPTOOLS_SCM_PRETEND_VERSION=0.0.0+${{ github.sha }}
          tags: ghcr.io/${{ env.REPO_OWNER }}/${{ matrix.image }}:${{ github.sha }}

  integration-test-pipeline:
    needs: [build-image]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: review-sentinel
            provider: anthropic
          - image: review-sentinel-anthropic
            provider: anthropic
          - image: review-sentinel-openai
            provider: openai
          - image: review-sentinel-google
            provider: google
    name: integration-test-pipeline (${{ matrix.image }})
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - run: uv sync

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Pipeline tests
        env:
          TEST_PIPELINE_ID: ${{ github.sha }}
          TEST_DOCKER_IMAGE: ghcr.io/${{ env.REPO_OWNER }}/${{ matrix.image }}:${{ github.sha }}
          TEST_PROVIDER: ${{ matrix.provider }}
          TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          TEST_GITLAB_TOKEN: ${{ secrets.TEST_GITLAB_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: uv run pytest tests/integration/ -m integration_pipeline -v

  integration-test-kubernetes:
    needs: [build-image]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - name: Start minikube
        uses: medyagh/setup-minikube@v0.0.19
        with:
          minikube-version: latest
          kubernetes-version: v1.31.0

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - run: uv sync

      - name: Set lowercase repository owner
        run: echo "REPO_OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> $GITHUB_ENV

      - name: Deploy to minikube
        working-directory: deploy
        env:
          TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: make deploy-ci IMAGE_TAG=${{ github.sha }} REGISTRY=ghcr.io/${{ env.REPO_OWNER }}

      - name: Dump cluster diagnostics on failure
        if: failure()
        run: |
          echo "::group::Nodes"
          kubectl get nodes -o wide || true
          echo "::endgroup::"
          echo "::group::Pods"
          kubectl -n review-sentinel get pods -o wide || true
          echo "::endgroup::"
          echo "::group::Describe pods"
          kubectl -n review-sentinel describe pods || true
          echo "::endgroup::"
          echo "::group::Server container logs (current)"
          kubectl -n review-sentinel logs -l app.kubernetes.io/component=server --all-containers --tail=-1 || true
          echo "::endgroup::"
          echo "::group::Server container logs (previous)"
          kubectl -n review-sentinel logs -l app.kubernetes.io/component=server --all-containers --previous --tail=-1 || true
          echo "::endgroup::"
          echo "::group::Events"
          kubectl -n review-sentinel get events --sort-by=.lastTimestamp || true
          echo "::endgroup::"
          echo "::group::Deployment"
          kubectl -n review-sentinel describe deployment review-sentinel-server || true
          echo "::endgroup::"

      - name: Run k8s integration test
        env:
          TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          TEST_PIPELINE_ID: ${{ github.sha }}
          K8S_IMAGE: ghcr.io/${{ env.REPO_OWNER }}/review-sentinel:${{ github.sha }}
        run: uv run pytest tests/integration/github/test_kubernetes.py -m integration_kubernetes -v

  integration-test-webhook-server:
    needs: [build-image]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"

      - run: uv sync

      - name: Install cloudflared
        run: ../scripts/ci/install-cloudflared.sh

      - name: Webhook server tests
        env:
          TEST_PIPELINE_ID: ${{ github.sha }}
          TEST_GITHUB_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          TEST_GITLAB_TOKEN: ${{ secrets.TEST_GITLAB_TOKEN }}
        run: uv run pytest tests/integration/ -m integration_webhook_server -v

  cleanup:
    needs: [integration-test-local, integration-test-pipeline, integration-test-webhook-server, integration-test-kubernetes]
    if: always() && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Clean stale test resources
        env:
          GH_TOKEN: ${{ secrets.TEST_GITHUB_TOKEN }}
          TEST_GITLAB_TOKEN: ${{ secrets.TEST_GITLAB_TOKEN }}
        run: scripts/ci/cleanup-stale-test-resources.sh

      - name: Delete SHA-tagged images
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for package in review-sentinel review-sentinel-anthropic review-sentinel-openai review-sentinel-google; do
            IMAGE_PACKAGE="$package" IMAGE_TAG="${{ github.sha }}" scripts/ci/cleanup-test-image.sh
          done

  ci:
    needs:
      - check
      - unit-test
      - unit-test-provider-isolation
      - integration-test-local
      - build-image
      - integration-test-pipeline
      - integration-test-webhook-server
      - integration-test-kubernetes
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: exit 1
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')

  promote:
    needs: [ci]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [review-sentinel, review-sentinel-anthropic, review-sentinel-openai, review-sentinel-google]
    permissions:
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag ${{ matrix.image }}:latest
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx imagetools create \
            --tag "ghcr.io/${REPO_OWNER}/${{ matrix.image }}:latest" \
            "ghcr.io/${REPO_OWNER}/${{ matrix.image }}:${{ github.sha }}"

  release:
    needs: [ci]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [review-sentinel, review-sentinel-anthropic, review-sentinel-openai, review-sentinel-google]
    permissions:
      packages: write

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Retag ${{ matrix.image }}:${{ github.ref_name }}
        run: |
          REPO_OWNER="${GITHUB_REPOSITORY_OWNER,,}"
          docker buildx imagetools create \
            --tag "ghcr.io/${REPO_OWNER}/${{ matrix.image }}:${{ github.ref_name }}" \
            "ghcr.io/${REPO_OWNER}/${{ matrix.image }}:${{ github.sha }}"
